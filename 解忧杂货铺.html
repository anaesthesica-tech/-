<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>喵喵</title>
<!-- Three.js CDN (跳一跳用到) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif; }
  html, body { width:100%; height:100%; }
  body {
    background: linear-gradient(145deg, #0b1a2e 0%, #1d3b5c 100%);
    color:#eef5ff;
    overflow-x:hidden;
  }
  .app {
    width:100%; min-height:100vh;
    padding: 20px clamp(16px, 4vw, 48px) 40px;
    display:flex; flex-direction:column; position:relative;
  }
  .inner {
    width:100%; max-width: 1080px; margin: 0 auto;
    display:flex; flex-direction:column; flex:1;
  }
  .screen { display:none; flex-direction:column; flex:1; animation: fade .25s ease; }
  .screen.active { display:flex; }
  @keyframes fade { from{opacity:.5; transform:scale(.99);} to{opacity:1; transform:scale(1);} }

  /* ========== 验证页 ========== */
  .group-header { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  .group-avatar {
    width:64px; height:64px; border-radius: 50%;
    background: linear-gradient(135deg,#3b82f6,#8b5cf6);
    display:flex; align-items:center; justify-content:center;
    font-size:32px; flex-shrink:0;
    overflow: hidden; position: relative;
    border: 3px solid rgba(255,255,255,.85);
    box-shadow: 0 8px 18px rgba(59,130,246,.4), 0 0 0 2px rgba(59,130,246,.35);
  }
  .group-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.15); }
  .group-header h2 { font-size:24px; font-weight:700; }
  .group-header p { font-size:14px; color:#9bb8da; margin-top:3px; }
  .member-count {
    background: rgba(59,130,246,.25); padding:3px 10px; border-radius:30px;
    font-size:12px; color:#b3d9ff; margin-left:6px;
  }

  .members-list {
    display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap:14px; max-height: 68vh; overflow-y:auto; padding: 6px 8px 6px 4px;
  }
  .members-list::-webkit-scrollbar { width:6px; }
  .members-list::-webkit-scrollbar-thumb { background:#3b82f6; border-radius:10px; }

  .member-item {
    position:relative;
    background: rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    border-radius: 22px; padding: 14px 16px;
    display:flex; align-items:center; gap:12px; cursor:pointer;
    transition: transform .28s cubic-bezier(.34,1.56,.64,1), background .25s ease, border-color .25s ease, box-shadow .3s ease;
    opacity:0; transform: translateY(12px) scale(.94);
    animation: cardIn .5s cubic-bezier(.34,1.56,.64,1) forwards;
    overflow:hidden;
  }
  .member-item:nth-child(3n+2) { margin-top: 8px; }
  .member-item:nth-child(3n)   { margin-top: 4px; }
  @keyframes cardIn {
    0%   { opacity:0; transform: translateY(14px) scale(.9); }
    60%  { opacity:1; transform: translateY(-3px) scale(1.02); }
    100% { opacity:1; transform: translateY(0) scale(1); }
  }
  .member-item:hover {
    background: rgba(59,130,246,.18); border-color: rgba(59,130,246,.6);
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 14px 28px -10px rgba(59,130,246,.55), 0 0 0 1px rgba(59,130,246,.3) inset;
  }
  .member-item:active { transform: translateY(-1px) scale(.99); }
  .member-item::after {
    content:''; position:absolute; top:0; left:-120%; width:60%; height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.18), transparent);
    transform: skewX(-20deg); transition: left .6s ease; pointer-events:none;
  }
  .member-item:hover::after { left: 130%; }

  .member-avatar {
    width:46px; height:46px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:18px; flex-shrink:0;
    border:1.5px solid rgba(255,255,255,.2);
    box-shadow: 0 6px 14px -6px rgba(0,0,0,.6);
    transition: transform .3s ease; position:relative; overflow: hidden;
  }
  .member-item:hover .member-avatar { animation: avatarBounce .6s ease; }
  @keyframes avatarBounce {
    0%   { transform: translateY(0) rotate(0deg); }
    30%  { transform: translateY(-5px) rotate(-6deg); }
    60%  { transform: translateY(2px) rotate(4deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  .member-name { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 110px; }
  .arrow { color:#5f7f9f; font-size:16px; margin-left:auto; transition: transform .3s cubic-bezier(.34,1.56,.64,1), color .25s; }
  .member-item:hover .arrow { color:#60a5fa; transform: translateX(4px) scale(1.15); }
  .footer-note { font-size:12px; color:#4a607a; text-align:center; margin-top:20px; letter-spacing:.5px; }

  /* ========== 验证输入页 ========== */
  .input-page-wrap { max-width: 460px; width:100%; margin: 20px auto 0; }
  .back-btn {
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
    padding:9px 18px; border-radius:40px; color:#b3d9ff; font-size:14px;
    width:fit-content; margin-bottom:20px; cursor:pointer; transition:.15s;
  }
  .back-btn:hover { background:rgba(59,130,246,.2); color:#fff; }
  .selected-card {
    background:rgba(59,130,246,.15); border:1px solid rgba(59,130,246,.4);
    border-radius:32px; padding:18px 20px; display:flex; align-items:center; gap:16px; margin-bottom:26px;
  }
  .selected-avatar {
    width:54px; height:54px; border-radius:40px; display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:600; border:2px solid #3b82f6; overflow: hidden;
  }
  .selected-card h3 { font-size:18px; }
  .selected-card p { font-size:13px; color:#9bb8da; margin-top:4px; }
  .input-label { font-size:15px; font-weight:500; margin-bottom:10px; display:block; color:#c2d9f0; }
  .input-group {
    display:flex; background:rgba(0,0,0,.35); border-radius:60px;
    border:1.5px solid rgba(255,255,255,.1); padding:4px 4px 4px 20px;
    transition:.2s; margin-bottom:12px;
  }
  .input-group:focus-within { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.3); }
  .input-group input {
    flex:1; background:transparent; border:none; outline:none; color:#fff;
    font-size:18px; letter-spacing:2px; padding:14px 0;
  }
  .input-group input::placeholder { color:#6886a6; letter-spacing:0; font-size:16px; }
  .btn-primary {
    background:#3b82f6; border:none; border-radius:50px; padding:14px;
    font-weight:600; font-size:16px; color:#fff; cursor:pointer; transition:.18s;
    width:100%; box-shadow:0 8px 20px -6px #3b82f6;
  }
  .btn-primary:hover { background:#2563eb; }
  .btn-primary:active { transform:scale(.98); }
  .error-msg { color:#f87171; font-size:14px; margin-top:10px; padding-left:8px; min-height:20px; }
  .hint-text { font-size:12px; color:#6886a6; margin-top:14px; text-align:center; }

  /* ========== 游戏平台 ========== */
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px; flex-wrap:wrap; }
  .topbar-left { display:flex; align-items:center; gap:10px; }
  .logo {
    width:44px; height:44px; border-radius: 50%;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    display:flex; align-items:center; justify-content:center; font-size:22px;
    overflow: hidden; position: relative;
    border: 2px solid rgba(255,255,255,.85);
    box-shadow: 0 4px 12px rgba(59,130,246,.4), 0 0 0 1.5px rgba(59,130,246,.35);
    flex-shrink: 0;
  }
  .logo img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1.15);
  }
  .logo-text { font-weight:700; font-size:19px; }
  .topbar-right { display:flex; align-items:center; gap:10px; }
  .user-chip {
    display:flex; align-items:center; gap:8px; cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    padding:5px 14px 5px 6px; border-radius:40px; transition:.15s;
  }
  .user-chip:hover { background:rgba(59,130,246,.2); }
  .user-avatar {
    width:34px; height:34px; border-radius:40px; display:flex; align-items:center; justify-content:center;
    font-weight:600; font-size:15px; overflow: hidden;
  }
  .user-name { font-size:14px; font-weight:500; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .user-name small { color:#9bb8da; font-weight:400; }
  .logout-icon {
    width:38px; height:38px; border-radius:40px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    cursor:pointer; font-size:16px; transition:.15s;
  }
  .logout-icon:hover { background:rgba(239,68,68,.25); color:#fca5a5; }

  .nav-tabs {
    display:flex; gap:6px; margin-bottom:22px;
    background:rgba(0,0,0,.2); padding:5px; border-radius:40px;
    border:1px solid rgba(255,255,255,.05);
    overflow-x:auto; flex-wrap:nowrap; max-width: 100%; width:fit-content;
  }
  .nav-tabs::-webkit-scrollbar { display:none; }
  .nav-tab {
    flex:0 0 auto; text-align:center;
    padding:10px 22px; border-radius:34px; font-size:14px; font-weight:500;
    color:#9bb8da; cursor:pointer; transition:.15s; white-space:nowrap;
    border:none; background:transparent;
  }
  .nav-tab:hover { color:#fff; background:rgba(255,255,255,.05); }
  .nav-tab.active {
    background:linear-gradient(135deg,#3b82f6,#8b5cf6); color:#fff;
    box-shadow:0 6px 16px -6px #3b82f6;
  }

  .content-pane { display:none; flex-direction:column; flex:1; animation:fade .25s ease; }
  .content-pane.active { display:flex; }

  .games-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:14px; }
  .game-card {
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    border-radius:24px; padding:26px 16px; text-align:center; cursor:pointer;
    transition:.18s; display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .game-card:hover {
    background:rgba(59,130,246,.18); border-color:rgba(59,130,246,.5);
    transform:translateY(-3px); box-shadow:0 14px 24px -12px rgba(0,0,0,.6);
  }
  .game-card:active { transform:scale(.98); }
  .game-icon {
    width:72px; height:72px; border-radius:24px;
    display:flex; align-items:center; justify-content:center; font-size:34px;
    background:rgba(59,130,246,.2); border:1px solid rgba(59,130,246,.3);
  }
  .game-name { font-weight:600; font-size:16px; }
  .game-desc { font-size:12px; color:#89a9cc; }

  .panel-card {
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    border-radius:24px; padding:24px; margin-bottom:14px;
  }
  .panel-title { font-size:17px; font-weight:600; margin-bottom:8px; }
  .panel-sub { font-size:13px; color:#9bb8da; line-height:1.6; }

  .fortune-box { text-align:center; padding:36px 20px; }
  .fortune-emoji { font-size:64px; margin-bottom:14px; }
  .fortune-level { font-size:28px; font-weight:700; margin-bottom:8px; }
  .fortune-desc { font-size:15px; color:#c2d9f0; line-height:1.7; }
  .fortune-stars { font-size:22px; letter-spacing:4px; margin:14px 0; }

  .signin-box { text-align:center; padding:30px 20px; }
  .signin-days { font-size:56px; font-weight:700; background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .signin-label { font-size:14px; color:#9bb8da; margin-top:6px; }
  .signin-btn {
    background:linear-gradient(135deg,#3b82f6,#8b5cf6); border:none; border-radius:50px;
    padding:15px 44px; font-weight:600; font-size:16px; color:#fff; cursor:pointer;
    transition:.18s; margin-top:22px; box-shadow:0 8px 20px -6px #3b82f6;
  }
  .signin-btn:hover { transform:translateY(-2px); }
  .signin-btn:disabled { background:#334155; color:#94a3b8; cursor:not-allowed; box-shadow:none; transform:none; }
  .signin-history { display:flex; justify-content:center; gap:8px; margin-top:22px; flex-wrap:wrap; }
  .day-dot {
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#6886a6;
  }
  .day-dot.done { background:rgba(16,185,129,.25); border-color:#10b981; color:#6ee7b7; }

  .game-container-header { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .game-container-title { font-size:20px; font-weight:600; }
  #game-container {
    flex:1; min-height: 60vh; background:rgba(0,0,0,.25);
    border-radius:24px; border:1px dashed rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center;
    color:#6886a6; font-size:15px; text-align:center; padding:30px;
    position:relative;
  }

  .modal-mask {
    position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-mask.active { display:flex; }
  .modal {
    background:#152a42; border:1px solid rgba(80,170,255,.25);
    border-radius:28px; padding:26px; width:100%; max-width:380px;
    box-shadow:0 25px 50px rgba(0,0,0,.7); animation:fade .2s ease;
  }
  .modal h3 { font-size:19px; margin-bottom:18px; }
  .modal-label { font-size:13px; color:#9bb8da; margin-bottom:8px; display:block; }
  .modal-input {
    width:100%; background:rgba(0,0,0,.35); border:1.5px solid rgba(255,255,255,.1);
    border-radius:40px; padding:13px 18px; color:#fff; font-size:15px; outline:none;
    transition:.15s; margin-bottom:16px;
  }
  .modal-input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.3); }
  .modal-actions { display:flex; gap:10px; flex-wrap:wrap; }
  .modal-btn {
    flex:1; padding:12px; border-radius:50px; border:none; font-size:15px;
    font-weight:600; cursor:pointer; transition:.15s;
  }
  .modal-btn.primary { background:#3b82f6; color:#fff; }
  .modal-btn.primary:hover { background:#2563eb; }
  .modal-btn.secondary { background:rgba(255,255,255,.08); color:#c2d9f0; }
  .modal-btn.secondary:hover { background:rgba(255,255,255,.15); }
  .modal-btn.full { flex:1 1 100%; margin-bottom:10px; }
  .avatar-picker { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .avatar-option {
    width:46px; height:46px; border-radius:40px; display:flex; align-items:center; justify-content:center;
    font-size:20px; cursor:pointer; border:2px solid transparent; transition:.15s;
    color:#fff; font-weight:600;
  }
  .avatar-option.selected { border-color:#3b82f6; transform:scale(1.08); }
  .avatar-option:hover { transform:scale(1.08); }

  /* ========== 跳一跳样式 ========== */
  .jump-game-wrap {
    position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%; height: 100%; padding: 8px; box-sizing: border-box;
  }
  .jump-canvas-wrap {
    position: relative; border-radius: 18px; overflow: hidden;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,.7), 0 0 0 1px rgba(59,130,246,.3);
    background: #0e1c2e; max-width: 100%;
  }
  .jump-canvas-wrap canvas { display: block; max-width: 100%; touch-action: none; }
  .jump-hud {
    display: flex; gap: 20px; font-size: 14px; color: #c2d9f0;
    font-weight: 500; margin-bottom: 10px;
  }
  .jump-hud b { color: #60a5fa; font-size: 18px; }
  .jump-lb-btn {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border: none; border-radius: 50px; padding: 10px 24px;
    color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
    box-shadow: 0 6px 16px -6px #3b82f6; transition: .15s; margin-top: 12px;
  }
  .jump-lb-btn:hover { transform: translateY(-2px); }
  .jump-lb-btn:active { transform: scale(.97); }

  /* ========== 排行榜样式 ========== */
  .lb-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    backdrop-filter: blur(6px); display: none;
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .lb-mask.active { display: flex; }
  .lb-modal {
    background: #152a42; border: 1px solid rgba(80,170,255,.25);
    border-radius: 28px; padding: 24px; width: 100%; max-width: 420px;
    max-height: 80vh; display: flex; flex-direction: column;
    box-shadow: 0 25px 50px rgba(0,0,0,.7); animation: fade .2s ease;
  }
  .lb-modal h3 { font-size: 20px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .lb-subtitle { font-size: 12px; color: #6886a6; margin-bottom: 16px; }
  .lb-list {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    gap: 8px; padding-right: 4px; min-height: 200px;
  }
  .lb-list::-webkit-scrollbar { width: 5px; }
  .lb-list::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
  .lb-empty { text-align: center; color: #6886a6; font-size: 14px; padding: 40px 0; }
  .lb-row {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px; padding: 12px 14px; transition: .15s;
  }
  .lb-row.me {
    background: rgba(59,130,246,.18); border-color: rgba(59,130,246,.5);
    box-shadow: 0 0 0 1px rgba(59,130,246,.3) inset;
  }
  .lb-rank {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; background: rgba(255,255,255,.08);
    color: #9bb8da; flex-shrink: 0;
  }
  .lb-rank.top1 { background: linear-gradient(135deg,#fbbf24,#f59e0b); color: #0b1a2e; }
  .lb-rank.top2 { background: linear-gradient(135deg,#e5e7eb,#9ca3af); color: #0b1a2e; }
  .lb-rank.top3 { background: linear-gradient(135deg,#d97706,#92400e); color: #fff; }
  .lb-avatar {
    width: 40px; height: 40px; border-radius: 40px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 16px; overflow: hidden; flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,.15);
  }
  .lb-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lb-name { flex: 1; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { font-weight: 700; font-size: 18px; color: #60a5fa; flex-shrink: 0; }
  .lb-close {
    background: rgba(255,255,255,.08); border: none; border-radius: 50px;
    padding: 12px; color: #c2d9f0; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: .15s; margin-top: 16px;
  }
  .lb-close:hover { background: rgba(255,255,255,.15); }

  /* ========== 猜数字样式 ========== */
  .guess-wrap {
    width: 100%; max-width: 420px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 10px; box-sizing: border-box;
  }
  .guess-title { font-size: 16px; color: #9bb8da; text-align: center; line-height: 1.5; }
  .guess-title b { color: #60a5fa; font-size: 22px; }
  .guess-input-row { display: flex; gap: 8px; width: 100%; }
  .guess-input {
    flex: 1; background: rgba(0,0,0,.35);
    border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 60px; padding: 14px 20px; color: #fff;
    font-size: 18px; letter-spacing: 1px; outline: none; text-align: center;
  }
  .guess-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.3); }
  .guess-submit {
    background: #3b82f6; border: none; border-radius: 60px;
    padding: 14px 22px; color: #fff; font-weight: 600; font-size: 15px;
    cursor: pointer; transition: .15s; white-space: nowrap;
  }
  .guess-submit:hover { background: #2563eb; }
  .guess-submit:active { transform: scale(.97); }
  .guess-submit:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
  .guess-msg {
    min-height: 28px; font-size: 15px; font-weight: 500;
    text-align: center; color: #c2d9f0;
  }
  .guess-msg.higher { color: #f87171; }
  .guess-msg.lower { color: #60a5fa; }

  .guess-cell.revealed {

/* ============================================================

const MEMBERS = [

  { id:11, name:'小菜',        qqTail:'7053', avatarColor:'#eab308', qqAvatar:'https://bee-reg-ab.imagency.cn/mr/7423/26/6ad1e6d27909e.jpg' },
  { id:12, name:'夜烛',        qqTail:'7263', avatarColor:'#f97316', qqAvatar:'https://bee-reg-ab.imagency.cn/mr/7423/26/6ad1e6b043a12.jpg' },
  { id:13, name:'黑夜遮阳',    qqTail:'7853', avatarColor:'#0ea5e9', qqAvatar:'https://bee-reg-ab.imagency.cn/mr/7423/26/6ad1e6a8f045f.jpg' },
  { id:14, name:'繁花',        qqTail:'0998', avatarColor:'#a855f7', qqAvatar:'https://bee-reg-ab.imagency.cn/mr/7423/26/6ad1e6c9f2882.jpg' },
  { id:15, name:'乐乐',        qqTail:'3025', avatarColor:'#84cc16', qqAvatar:'https://bee-reg-ab.imagency.cn/mr/7423/26/6ad1e6a9b85d3.jpg' },
  { id:16, name:'狼王',        qqTail:'1857', avatarColor:'#ef4444', qqAvatar:'https://bee-reg-ab.imagency.cn/mr/7423/26/6ad1e6d125114.jpg' },
  { id:17, name:'弟弟',        qqTail:'6259', avatarColor:'#14b8a6', qqAvatar:'https://bee-reg-ab.imagency.cn/mr/7423/26/6ad1e6c7d6f79.jpg' },
  { id:18, name:'意趣',        qqTail:'4416', avatarColor:'#8b5cf6', qqAvatar:'https://bee-reg-ab.imagency.cn/mr/7423/26/6ad1e6b1e095b.jpg' },
  { id:19, name:'魔化',        qqTail:'6445', avatarColor:'#3b82f6', qqAvatar:'https://bee-reg-ab.imagency.cn/mr/7423/26/6ad1e6acd2cc6.jpg' },
  { id:20, name:'破晓',        qqTail:'6226', avatarColor:'#f59e0b', qqAvatar:'https://bee-reg-ab.imagency.cn/mr/7423/26/6ad1e6d6b4609.jpg' },
];

const GAMES = [
  { id:'jump',       name:'跳一跳',   icon:'🕹️', desc:'按住蓄力，跳得更远' },
  { id:'draw',       name:'你画我猜', icon:'🎨', desc:'一个人画，其他人猜' },
  { id:'guess',      name:'猜数字',   icon:'🔢', desc:'10×10 网格缩小范围' },
];

const AVATARS = ['😀','😎','🐱','🐼','🦊','🐧','🌟','🎮','🚀','🍀','🔥','🎯'];

/* ============================================================
   工具 & 存储
   ============================================================ */
const STORAGE_KEY = 'mini_game_platform_user';

function loadUser() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }
  catch(e){ return null; }
}
function saveUser(u) { localStorage.setItem(STORAGE_KEY, JSON.stringify(u)); }
function clearUser() { localStorage.removeItem(STORAGE_KEY); }

function displayName(user) {
  if (!user) return '';
  if (user.originalName && user.nickname && user.nickname !== user.originalName) {
    return `${user.nickname}（${user.originalName}）`;
  }
  return user.nickname || user.originalName || '';
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ============================================================
   屏幕1：渲染成员列表
   ============================================================ */
const membersListEl = document.getElementById('membersList');
const memberCountEl = document.getElementById('memberCount');

function renderMembers() {
  memberCountEl.textContent = MEMBERS.length + ' 名成员';
  membersListEl.innerHTML = '';
  const shuffled = [...MEMBERS].sort(() => Math.random() - 0.5);

  shuffled.forEach((m, idx) => {
    const item = document.createElement('div');
    item.className = 'member-item';
    const initial = m.name.charAt(0);
    item.style.animationDelay = (idx * 40) + 'ms';

    let avatarInner;
    if (m.qqAvatar && m.qqAvatar.trim() !== '') {
      avatarInner = `<img src="${m.qqAvatar}" alt="${m.name}"
        style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;"
        onerror="this.style.display='none';this.parentNode.textContent='${initial}';this.parentNode.style.background='${m.avatarColor}';"
      >`;
    } else {
      avatarInner = initial;
    }

    item.innerHTML = `
      <div class="member-avatar" style="background:${m.avatarColor};overflow:hidden;">${avatarInner}</div>
      <div class="member-name">${m.name}</div>
      <div class="arrow">→</div>
    `;
    item.addEventListener('click', () => goToInput(m));
    membersListEl.appendChild(item);
  });
}

/* ============================================================
   屏幕2：验证输入
   ============================================================ */
let currentMember = null;
const selectedCardEl = document.getElementById('selectedCard');
const qqTailInput = document.getElementById('qqTailInput');
const errorMsgEl = document.getElementById('errorMsg');

function goToInput(member) {
  currentMember = member;
  const initial = member.name.charAt(0);

  let avatarInner;
  if (member.qqAvatar && member.qqAvatar.trim() !== '') {
    avatarInner = `<img src="${member.qqAvatar}" alt="${member.name}"
      style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;"
      onerror="this.style.display='none';this.parentNode.textContent='${initial}';this.parentNode.style.background='${member.avatarColor}';"
    >`;
  } else {
    avatarInner = initial;
  }

  selectedCardEl.innerHTML = `
    <div class="selected-avatar" style="background:${member.avatarColor};overflow:hidden;">${avatarInner}</div>
    <div>
      <h3>${member.name}</h3>
      <p>请验证后四位</p>
    </div>
  `;
  qqTailInput.value = '';
  errorMsgEl.textContent = '';
  showScreen('screen-input');
  setTimeout(() => qqTailInput.focus(), 100);
}

document.getElementById('backToMembers').addEventListener('click', () => {
  showScreen('screen-verify');
});

qqTailInput.addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,4);
});

function doVerify() {
  if (!currentMember) return;
  const val = qqTailInput.value.trim();
  if (val.length !== 4) {
    errorMsgEl.textContent = '⚠️ 请输入4位数字';
    return;
  }
  if (val === currentMember.qqTail) {
    errorMsgEl.textContent = '';
    loginUser(currentMember);
  } else {
    errorMsgEl.textContent = '❌ 后四位不匹配，请重试';
    qqTailInput.value = '';
    qqTailInput.focus();
  }
}
document.getElementById('verifyBtn').addEventListener('click', doVerify);
qqTailInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); doVerify(); }
});

/* ============================================================
   登录 / 用户状态
   ============================================================ */
function loginUser(member) {
  const existing = loadUser();
  const user = {
    memberId: member.id,
    originalName: member.name,
    nickname: (existing && existing.memberId === member.id && existing.nickname) ? existing.nickname : member.name,
    avatar: (existing && existing.memberId === member.id && existing.avatar) ? existing.avatar : (member.qqAvatar || member.avatarColor),
    avatarText: (existing && existing.memberId === member.id && existing.avatarText) ? existing.avatarText : member.name.charAt(0),
    avatarIsImage: (existing && existing.memberId === member.id && existing.avatarIsImage !== undefined)
                    ? existing.avatarIsImage
                    : (member.qqAvatar && member.qqAvatar.trim() !== '' ? true : false),
    signinDays: (existing && existing.memberId === member.id) ? (existing.signinDays || 0) : 0,
    lastSignin: (existing && existing.memberId === member.id) ? (existing.lastSignin || '') : '',
  };
  saveUser(user);
  enterPlatform();
}

/* ============================================================
   屏幕3：平台
   ============================================================ */
const userAvatarEl = document.getElementById('userAvatar');
const userNameEl = document.getElementById('userName');

function renderUserChip() {
  const user = loadUser();
  if (!user) return;

  if (user.avatarIsImage && user.avatar) {
    userAvatarEl.innerHTML = `<img src="${user.avatar}" alt="avatar"
      style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;"
      onerror="this.parentNode.textContent='${user.avatarText || '?'}';this.parentNode.style.background='#3b82f6';"
    >`;
    userAvatarEl.style.background = 'transparent';
  } else {
    userAvatarEl.innerHTML = '';
    userAvatarEl.textContent = user.avatarText || (user.nickname||'?').charAt(0);
    userAvatarEl.style.background = user.avatar || '#3b82f6';
  }
  userNameEl.innerHTML = displayName(user);
}

function enterPlatform() {
  renderUserChip();
  renderFortune();
  renderSignin();
  renderGames();
  switchTab('games');
  showScreen('screen-platform');
}

const navTabs = document.getElementById('navTabs');
navTabs.addEventListener('click', e => {
  const btn = e.target.closest('.nav-tab');
  if (!btn) return;
  switchTab(btn.dataset.tab);
});

function switchTab(tabName) {
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tabName);
  });
  document.querySelectorAll('.content-pane').forEach(p => {
    p.classList.toggle('active', p.id === 'pane-' + tabName);
  });
}

/* ---------- 今日运势 ---------- */
const FORTUNES = [
  { emoji:'🌟', level:'大吉', stars:'★★★★★', desc:'今日诸事顺利。' },
  { emoji:'🍀', level:'中吉', stars:'★★★★☆', desc:'运势平稳。' },
  { emoji:'☀️', level:'小吉', stars:'★★★☆☆', desc:'注意休息。' },
  { emoji:'🌧️', level:'凶', stars:'★★☆☆☆', desc:'小心细节，避免意外。' },
  { emoji:'🌈', level:'大凶',   stars:'★★★★☆', desc:'区' },
];

function renderFortune() {
  const today = new Date();
  const seed = today.getFullYear()*10000 + (today.getMonth()+1)*100 + today.getDate();
  const idx = seed % FORTUNES.length;
  const f = FORTUNES[idx];
  document.getElementById('fortuneEmoji').textContent = f.emoji;
  document.getElementById('fortuneLevel').textContent = f.level;
  document.getElementById('fortuneStars').textContent = f.stars;
  document.getElementById('fortuneDesc').textContent = f.desc;
}

/* ---------- 签到 ---------- */
const signinDaysEl = document.getElementById('signinDays');
const signinBtn = document.getElementById('signinBtn');
const signinHistoryEl = document.getElementById('signinHistory');

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function renderSignin() {
  const user = loadUser();
  if (!user) return;
  signinDaysEl.textContent = user.signinDays || 0;
  const signedToday = user.lastSignin === todayStr();
  signinBtn.disabled = signedToday;
  signinBtn.textContent = signedToday ? '今日已签到 ✓' : '今日签到';

  signinHistoryEl.innerHTML = '';
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const dot = document.createElement('div');
    dot.className = 'day-dot' + (ds === user.lastSignin ? ' done' : '');
    dot.textContent = (d.getMonth()+1) + '/' + d.getDate();
    signinHistoryEl.appendChild(dot);
  }
}

signinBtn.addEventListener('click', () => {
  const user = loadUser();
  if (!user) return;
  if (user.lastSignin === todayStr()) return;
  user.signinDays = (user.signinDays || 0) + 1;
  user.lastSignin = todayStr();
  saveUser(user);
  renderSignin();
});

/* ---------- 游戏网格 ---------- */
const gamesGridEl = document.getElementById('gamesGrid');
function renderGames() {
  gamesGridEl.innerHTML = '';
  GAMES.forEach(g => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.innerHTML = `
      <div class="game-icon">${g.icon}</div>
      <div class="game-name">${g.name}</div>
      <div class="game-desc">${g.desc}</div>
    `;
    card.addEventListener('click', () => openGame(g));
    gamesGridEl.appendChild(card);
  });
}

/* ============================================================
   屏幕4：游戏容器
   ============================================================ */
const gameTitleEl = document.getElementById('gameTitle');
const gamePlaceholderName = document.getElementById('gamePlaceholderName');
const gameContainer = document.getElementById('game-container');

function openGame(game) {
  gameTitleEl.textContent = game.name;
  gamePlaceholderName.textContent = game.name;

  showScreen('screen-game');

  if (game.id === 'jump') {
    startJumpGame(gameContainer);
  } else if (game.id === 'guess') {
    startGuessGame(gameContainer);
  } else if (game.id === 'draw') {

function buildLbRows(list, scoreGetter, suffix, me) {
  if (!list.length) {
    return '<div class="lb-empty">还没有人上榜<br>快去玩一局吧！</div>';
  }
  return list.map((item, i) => {
    const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
    let avatarInner;
    if (item.avatarIsImage && item.avatar) {
      avatarInner = `<img src="${item.avatar}" alt=""
        onerror="this.style.display='none';this.parentNode.textContent='${item.avatarText || (item.name||'?').charAt(0)}';this.parentNode.style.background='#3b82f6';"
      >`;
    } else {
      avatarInner = item.avatarText || (item.name||'?').charAt(0);
    }
    const avatarBg = item.avatarIsImage ? 'transparent' : (item.avatar || '#3b82f6');
    const isMe = me && me.memberId === item.memberId;
    return `
      <div class="lb-row ${isMe ? 'me' : ''}">
        <div class="lb-rank ${rankClass}">${i + 1}</div>
        <div class="lb-avatar" style="background:${avatarBg}">${avatarInner}</div>
        <div class="lb-name">${item.name}${isMe ? ' （我）' : ''}</div>
        <div class="lb-score">${scoreGetter(item)}${suffix}</div>
      </div>
    `;
  }).join('');
}

function startJumpGame(container) {
  if (jumpCleanup) { jumpCleanup(); jumpCleanup = null; }
  container.innerHTML = '';

  if (typeof THREE === 'undefined') {
    container.innerHTML = '<p style="color:#f87171;">Three.js 未加载，请检查网络或 CDN 链接</p>';
    return;
  }

  const W = 380, H = 520;

  const wrap = document.createElement('div');
  wrap.className = 'jump-game-wrap';

  const hud = document.createElement('div');
  hud.className = 'jump-hud';
  hud.innerHTML = `<div>得分：<b id="jump-score">0</b></div><div>最高：<b id="jump-best">0</b></div>`;

  const canvasWrap = document.createElement('div');
  canvasWrap.className = 'jump-canvas-wrap';

  const lbBtn = document.createElement('button');
  lbBtn.className = 'jump-lb-btn';
  lbBtn.textContent = '🏆 排行榜';
  lbBtn.addEventListener('click', openJumpLeaderboard);

  wrap.appendChild(hud);
  wrap.appendChild(canvasWrap);
  wrap.appendChild(lbBtn);
  container.appendChild(wrap);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1c2e);

  const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 1000);
  camera.position.set(0, 8, 12);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  canvasWrap.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
  dirLight.position.set(5, 15, 8);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const G = {
    cubes: [],
    jumper: null,
    power: 0,
    charging: false,
    score: 0,
    best: Number(localStorage.getItem('jump_best') || 0),
    over: false,
    jumping: false,
    jumpStart: 0,
    jumpFrom: null,
    jumpTo: null,
    jumpDuration: 420,
    jumpArc: 1.2,
  };

  const CUBE_COLORS = [0x3b82f6, 0x8b5cf6, 0x10b981, 0xf59e0b, 0xef4444, 0x06b6d4, 0xec4899, 0x14b8a6];
  const CUBE_SIZE = 1.2;
  const CUBE_HEIGHT = 0.6;

  function createCube(x, z, colorIdx) {
    const geo = new THREE.BoxGeometry(CUBE_SIZE, CUBE_HEIGHT, CUBE_SIZE);
    const mat = new THREE.MeshStandardMaterial({
      color: CUBE_COLORS[colorIdx % CUBE_COLORS.length],
      roughness: 0.4, metalness: 0.1,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, -CUBE_HEIGHT / 2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    return { mesh, x, z, size: CUBE_SIZE };
  }

  function createJumper() {
    const geo = new THREE.CylinderGeometry(0.22, 0.28, 0.5, 12);
    const mat = new THREE.MeshStandardMaterial({ color: 0x60a5fa, roughness: 0.3 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    scene.add(mesh);
    return mesh;
  }

  function updateHUD() {
    const s = document.getElementById('jump-score');
    const b = document.getElementById('jump-best');
    if (s) s.textContent = G.score;
    if (b) b.textContent = G.best;
  }

  function resetGame() {
    G.cubes.forEach(c => scene.remove(c.mesh));
    G.cubes = [];
    if (G.jumper) scene.remove(G.jumper);

    G.cubes.push(createCube(0, 0, 0));
    const dir = Math.random() > 0.5 ? 1 : -1;
    const dist = 2.2 + Math.random() * 1.2;
    G.cubes.push(createCube(dir * dist, 0, 1));

    G.jumper = createJumper();
    G.jumper.position.set(0, CUBE_HEIGHT / 2 + 0.25, 0);

    G.power = 0; G.charging = false; G.score = 0;
    G.over = false; G.jumping = false;
    G.jumpFrom = null; G.jumpTo = null;
    updateHUD();
    updateCamera(true);
  }

  function updateCamera(instant) {
    const current = G.cubes[G.cubes.length - 2] || G.cubes[G.cubes.length - 1];
    if (!current) return;
    const targetX = current.x;
    const targetZ = current.z;

    if (instant) {
      camera.position.set(targetX, 8, targetZ + 12);
      camera.lookAt(targetX, 0, targetZ);
    } else {
      camera.position.x += (targetX - camera.position.x) * 0.1;
      camera.position.z += (targetZ + 12 - camera.position.z) * 0.1;
      camera.lookAt(targetX, 0, targetZ);
    }
  }

  const canvasEl = renderer.domElement;

  function onDown(e) {
    if (G.over || G.jumping) return;
    e.preventDefault();
    G.charging = true;
    G.power = 0;
  }
  function onUp(e) {
    if (!G.charging) return;
    e.preventDefault();
    G.charging = false;
    if (G.over || G.jumping) return;
    doJump();
  }

  canvasEl.addEventListener('mousedown', onDown);
  window.addEventListener('mouseup', onUp);
  canvasEl.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('touchend', onUp, { passive: false });

  function doJump() {
    if (G.jumping) return;
    const p = Math.min(G.power, 1);
    const current = G.cubes[G.cubes.length - 2];
    const next = G.cubes[G.cubes.length - 1];
    if (!current || !next) return;

    const distance = 0.8 + p * 3.0;
    const dir = next.x > current.x ? 1 : -1;
    const targetX = current.x + dir * distance;

    G.jumping = true;
    G.jumpStart = performance.now();
    G.jumpFrom = { x: G.jumper.position.x, z: G.jumper.position.z };
    G.jumpTo = { x: targetX, z: current.z, distance, dir };
    G.jumpArc = 1.2 + p * 1.0;
  }

  function endJump() {
    G.jumping = false;
    const next = G.cubes[G.cubes.length - 1];
    const jx = G.jumper.position.x;
    const jz = G.jumper.position.z;

    const dx = Math.abs(jx - next.x);
    const dz = Math.abs(jz - next.z);
    const onCube = dx < CUBE_SIZE / 2 && dz < CUBE_SIZE / 2;

    if (!onCube) {
      gameOver();
      return;
    }

    G.score += 1;
    if (G.score > G.best) {
      G.best = G.score;
      localStorage.setItem('jump_best', G.best);
    }
    updateHUD();

    const last = G.cubes[G.cubes.length - 1];
    const newDir = Math.random() > 0.5 ? 1 : -1;
    const newDist = 2.0 + Math.random() * 1.5;
    G.cubes.push(createCube(last.x + newDir * newDist, last.z, G.score + 2));

    while (G.cubes.length > 8) {
      const old = G.cubes.shift();
      scene.remove(old.mesh);
    }

    updateCamera(false);
  }

  function gameOver() {
    G.over = true;
    let dropStart = performance.now();
    const startY = G.jumper.position.y;
    function dropAnim(now) {
      const t = Math.min((now - dropStart) / 500, 1);
      G.jumper.position.y = startY - t * 4;
      G.jumper.rotation.z = t * 0.8;
      if (t < 1) {
        requestAnimationFrame(dropAnim);
      } else {
        reportJumpScore(G.score);
        setTimeout(() => {
          if (G.over) {
            canvasEl.style.cursor = 'pointer';
            canvasEl.addEventListener('click', restartOnce);
          }
        }, 200);
      }
    }
    requestAnimationFrame(dropAnim);
  }

  function restartOnce() {
    canvasEl.removeEventListener('click', restartOnce);
    resetGame();
  }

  let rafId = null;
  let lastTime = 0;

  function loop(now) {
    rafId = requestAnimationFrame(loop);
    const dt = Math.min(now - lastTime, 50);
    lastTime = now;

    if (G.charging && !G.over) {
      G.power = Math.min(G.power + dt / 800, 1);
    }

    if (G.jumping && G.jumpTo) {
      const t = Math.min((performance.now() - G.jumpStart) / G.jumpDuration, 1);
      const easeT = 1 - Math.pow(1 - t, 2);

      G.jumper.position.x = G.jumpFrom.x + (G.jumpTo.x - G.jumpFrom.x) * easeT;
      G.jumper.position.z = G.jumpFrom.z + (G.jumpTo.z - G.jumpFrom.z) * easeT;
      G.jumper.position.y = CUBE_HEIGHT / 2 + 0.25 + Math.sin(t * Math.PI) * G.jumpArc;

      if (t >= 1) {
        G.jumper.position.y = CUBE_HEIGHT / 2 + 0.25;
        endJump();
      }
    }

    if (G.jumper) {
      if (G.charging) {
        const squash = 1 + G.power * 0.4;
        G.jumper.scale.y = squash;
        G.jumper.scale.x = 1 / Math.sqrt(squash);
        G.jumper.scale.z = 1 / Math.sqrt(squash);
      } else {
        G.jumper.scale.y += (1 - G.jumper.scale.y) * 0.2;
        G.jumper.scale.x += (1 - G.jumper.scale.x) * 0.2;
        G.jumper.scale.z += (1 - G.jumper.scale.z) * 0.2;
      }
    }

    if (!G.jumping && !G.over) {
      updateCamera(false);
    }

    renderer.render(scene, camera);
  }

  jumpCleanup = () => {
    if (rafId) cancelAnimationFrame(rafId);
    canvasEl.removeEventListener('mousedown', onDown);
    window.removeEventListener('mouseup', onUp);
    canvasEl.removeEventListener('touchstart', onDown);
    window.removeEventListener('touchend', onUp);
    canvasEl.removeEventListener('click', restartOnce);
    renderer.dispose();
    scene.clear();
  };

  resetGame();
  lastTime = performance.now();
  rafId = requestAnimationFrame(loop);
}

function startGuessGame(container) {
  if (jumpCleanup) { jumpCleanup(); jumpCleanup = null; }
  container.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'guess-wrap';

  const title = document.createElement('div');
  title.className = 'guess-title';
  title.innerHTML = '我想了一个 <b>1-100</b> 之间的数字<br>猜猜看？';

  const grid = document.createElement('div');
  grid.className = 'guess-grid';
  const cells = [];
  for (let i = 1; i <= 100; i++) {
    const cell = document.createElement('div');
    cell.className = 'guess-cell';
    cell.textContent = i;
    cell.dataset.num = i;
    cells.push(cell);
    grid.appendChild(cell);
  }

  const inputRow = document.createElement('div');
  inputRow.className = 'guess-input-row';

  const input = document.createElement('input');
  input.className = 'guess-input';
  input.type = 'tel';
  input.inputMode = 'numeric';
  input.maxLength = 3;
  input.placeholder = '输入 1-100';

  const submitBtn = document.createElement('button');
  submitBtn.className = 'guess-submit';
  submitBtn.textContent = '猜！';

  inputRow.appendChild(input);
  inputRow.appendChild(submitBtn);

  const msg = document.createElement('div');
  msg.className = 'guess-msg';
  msg.textContent = '';

  const actions = document.createElement('div');
  actions.className = 'guess-actions';

  const lbBtn = document.createElement('button');
  lbBtn.className = 'guess-btn';
  lbBtn.textContent = '🏆 排行榜';

  const restartBtn = document.createElement('button');
  restartBtn.className = 'guess-btn';
  restartBtn.textContent = '🔄 重新开始';
  restartBtn.style.display = 'none';

  actions.appendChild(lbBtn);
  actions.appendChild(restartBtn);

  wrap.appendChild(title);
  wrap.appendChild(grid);
  wrap.appendChild(inputRow);
  wrap.appendChild(msg);
  wrap.appendChild(actions);
  container.appendChild(wrap);

  let target = Math.floor(Math.random() * 100) + 1;
  let tries = 0;
  let gameOver = false;
  let lastGuess = null;

  function refreshGrid() {
    cells.forEach(cell => {
      const n = Number(cell.dataset.num);
      cell.classList.remove('last-guess', 'win', 'revealed');
      if (lastGuess !== null) {
        if (lastGuess < target && n < lastGuess) {
          cell.classList.add('eliminated');
        } else if (lastGuess > target && n > lastGuess) {
          cell.classList.add('eliminated');
        }
      }
    });
  }

  function highlightGuess(n) {
    cells.forEach(c => c.classList.remove('last-guess'));
    const cell = cells[n - 1];
    if (cell) cell.classList.add('last-guess');
  }

  function newRound() {
    target = Math.floor(Math.random() * 100) + 1;
    tries = 0;
    gameOver = false;
    lastGuess = null;
    msg.textContent = '';
    msg.className = 'guess-msg';
    input.value = '';
    input.disabled = false;
    submitBtn.disabled = false;
    submitBtn.textContent = '猜！';
    restartBtn.style.display = 'none';
    cells.forEach(c => { c.className = 'guess-cell'; });
    input.focus();
  }

  function submitGuess() {
    if (gameOver) return;
    const raw = input.value.trim();
    const n = parseInt(raw, 10);
    if (!raw || isNaN(n) || n < 1 || n > 100) {
      msg.textContent = '请输入 1-100 之间的整数';
      msg.className = 'guess-msg';
      input.value = '';
      input.focus();
      return;
    }

    tries++;

    if (n === target) {
      gameOver = true;
      lastGuess = n;
      highlightGuess(n);
      cells[n - 1].classList.add('win');

      cells.forEach(c => {
        const num = Number(c.dataset.num);
        if (num !== n) c.classList.add('revealed');
      });

      msg.textContent = `🎉 猜对了！用了 ${tries} 次`;
      msg.className = 'guess-msg win';
      input.disabled = true;
      submitBtn.disabled = true;
      submitBtn.textContent = '已结束';
      restartBtn.style.display = 'inline-block';

      reportGuessScore(tries);
      return;
    }

    lastGuess = n;
    highlightGuess(n);
    refreshGrid();

    const hint = n < target ? '小了' : '大了';
    const cls = n < target ? 'lower' : 'higher';
    msg.textContent = `${n} ${hint}，范围缩小了`;
    msg.className = 'guess-msg ' + cls;

    input.value = '';
    input.focus();
  }

  submitBtn.addEventListener('click', submitGuess);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); submitGuess(); }
  });
  input.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
  });

  lbBtn.addEventListener('click', openGuessLeaderboard);
  restartBtn.addEventListener('click', newRound);

  input.focus();

  jumpCleanup = () => {};
}

function bindDrawEvents(container) {
  const user = loadUser();
  const lobbyEl = document.getElementById('draw-lobby');
  const roomEl = document.getElementById('draw-room');
  const roomIdDisplay = document.getElementById('draw-room-id-display');
  const playersEl = document.getElementById('draw-players');
  const statusEl = document.getElementById('draw-status');
  const boardArea = document.getElementById('draw-board-area');
  const guessArea = document.getElementById('draw-guess-area');
  const targetWordEl = document.getElementById('draw-target-word');
  const canvas = document.getElementById('draw-canvas');
  const imageDisplay = document.getElementById('draw-image-display');
  const waitingOverlay = document.getElementById('draw-waiting-overlay');
  const messagesEl = document.getElementById('draw-messages');

  document.getElementById('draw-create-btn').onclick = () => {
    const roomId = Math.random().toString(36).substring(2, 6).toUpperCase();
    const roomRef = fbDb.ref('draw_rooms/' + roomId);
    roomRef.set({
      status: 'drawing',
      drawerId: user.memberId,
      drawerName: user.nickname || user.originalName,
      word: DRAW_WORDS[Math.floor(Math.random() * DRAW_WORDS.length)],
      imageData: '',
      players: { [user.memberId]: { name: user.nickname || user.originalName, score: 0 } },
      round: 1
    }).then(() => {
      joinDrawRoom(roomId);
    });
  };

  document.getElementById('draw-join-btn').onclick = () => {
    const roomId = document.getElementById('draw-room-input').value.trim().toUpperCase();
    if (!roomId) return alert('请输入房间号');
    
    fbDb.ref('draw_rooms/' + roomId).once('value').then(snapshot => {
      if (!snapshot.exists()) return alert('房间不存在');
      const data = snapshot.val();
      // 允许随时加入，直接覆盖分数为 0（或者保留之前的）
      fbDb.ref(`draw_rooms/${roomId}/players/${user.memberId}`).set({
        name: user.nickname || user.originalName,
        score: data.players?.[user.memberId]?.score || 0
      }).then(() => {
        joinDrawRoom(roomId);
      });
    });
  };

  document.getElementById('draw-leave-btn').onclick = () => {
    if (drawRoomId) {
      fbDb.ref(`draw_rooms/${drawRoomId}/players/${user.memberId}`).remove();
      fbDb.ref('draw_rooms/' + drawRoomId).off();
      drawRoomId = null;
    }
    lobbyEl.style.display = 'flex';
    roomEl.style.display = 'none';
  };

  function initCanvas() {
    if (!canvas) return;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    canvasCtx = canvas.getContext('2d');
    canvasCtx.fillStyle = '#fff';
    canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
    canvasCtx.lineCap = 'round';
    canvasCtx.lineJoin = 'round';
    canvasCtx.strokeStyle = '#000';
    canvasCtx.lineWidth = 4;
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  canvas.addEventListener('mousedown', (e) => { isDrawing = true; const p = getPos(e); canvasCtx.beginPath(); canvasCtx.moveTo(p.x, p.y); });
  canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; const p = getPos(e); canvasCtx.lineTo(p.x, p.y); canvasCtx.stroke(); });
  canvas.addEventListener('mouseup', () => isDrawing = false);
  canvas.addEventListener('mouseleave', () => isDrawing = false);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; const p = getPos(e); canvasCtx.beginPath(); canvasCtx.moveTo(p.x, p.y); }, {passive:false});
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!isDrawing) return; const p = getPos(e); canvasCtx.lineTo(p.x, p.y); canvasCtx.stroke(); }, {passive:false});
  canvas.addEventListener('touchend', (e) => { e.preventDefault(); isDrawing = false; }, {passive:false});

  document.getElementById('draw-submit-btn').onclick = () => {
    const imageData = canvas.toDataURL('image/jpeg', 0.5);
    fbDb.ref(`draw_rooms/${drawRoomId}/imageData`).set(imageData);
    fbDb.ref(`draw_rooms/${drawRoomId}/status`).set('guessing');
    boardArea.style.display = 'none';
    guessArea.style.display = 'flex';
    waitingOverlay.style.display = 'flex';
    waitingOverlay.innerHTML = '<span>等待其他玩家猜词...</span>';
  };

  document.getElementById('draw-guess-btn').onclick = submitGuess;
  document.getElementById('draw-guess-input').onkeydown = (e) => { if (e.key === 'Enter') submitGuess(); };

  function submitGuess() {
    const val = document.getElementById('draw-guess-input').value.trim();
    if (!val) return;
    
    fbDb.ref(`draw_rooms/${drawRoomId}`).once('value').then(snapshot => {
      const room = snapshot.val();
      if (room.word === val) {
        document.getElementById('draw-guess-input').value = '';
        const scoreRef = fbDb.ref(`draw_rooms/${drawRoomId}/players/${user.memberId}/score`);
        scoreRef.transaction(current => (current || 0) + 10);
        messagesEl.innerHTML = `<span style="color:#4ade80;font-weight:bold;">🎉 你猜对了！答案是「${val}」</span>`;
        fbDb.ref(`draw_rooms/${drawRoomId}/status`).set('result');
      } else {
        messagesEl.innerHTML = `<span style="color:#f87171;">「${val}」不对哦，再试试</span>`;
        document.getElementById('draw-guess-input').value = '';
      }
    });
  }

  window.joinDrawRoom = function(roomId) {
    drawRoomId = roomId;
    lobbyEl.style.display = 'none';
    roomEl.style.display = 'flex';
    roomIdDisplay.textContent = roomId;

    const roomRef = fbDb.ref('draw_rooms/' + roomId);
    roomRef.on('value', snapshot => {
      const room = snapshot.val();
      if (!room) {
        // 房间被删了
        lobbyEl.style.display = 'flex';
        roomEl.style.display = 'none';
        return;
      }

      let playersHtml = '';
      Object.keys(room.players || {}).forEach(uid => {
        const p = room.players[uid];
        playersHtml += `<span style="background:rgba(255,255,255,.1);padding:4px 10px;border-radius:20px;${String(uid) === String(room.drawerId) ? 'border:1px solid #f59e0b;' : ''}">${p.name} (${p.score || 0}分)</span>`;
      });
      playersEl.innerHTML = playersHtml;

      const isDrawer = String(room.drawerId) === String(user.memberId);

      if (room.status === 'drawing') {
        statusEl.textContent = `第 ${room.round} 轮：${room.drawerName} 正在作画`;
        if (isDrawer) {
          boardArea.style.display = 'flex';
          guessArea.style.display = 'none';
          targetWordEl.textContent = room.word;
          setTimeout(initCanvas, 50);
        } else {
          boardArea.style.display = 'none';
          guessArea.style.display = 'flex';
          waitingOverlay.style.display = 'flex';
          waitingOverlay.innerHTML = '<span>画手正在作画...</span>';
        }
         } else if (room.status === 'guessing') {
        statusEl.textContent = `请猜猜画的是什么？`;
        
        // 获取输入框和按钮的 DOM
        const guessInput = document.getElementById('draw-guess-input');
        const guessBtn = document.getElementById('draw-guess-btn');

        boardArea.style.display = 'none';
        guessArea.style.display = 'flex';
        imageDisplay.src = room.imageData || '';

        if (isDrawer) {
          waitingOverlay.style.display = 'none';
          if (guessInput) guessInput.style.display = 'none';
          if (guessBtn) guessBtn.style.display = 'none';
          messagesEl.innerHTML = '<span style="color:#9bb8da;">你是画手，请等待其他人猜词...</span>';
        } else {
          waitingOverlay.style.display = 'none';
          if (guessInput) guessInput.style.display = 'block';
          if (guessBtn) guessBtn.style.display = 'block';
        }
      } else if (room.status === 'result') {
        statusEl.textContent = `本轮结束！答案是：${room.word}`;
        if (!isDrawer) {
          messagesEl.innerHTML = `<span style="color:#4ade80;font-weight:bold;">🎉 有人猜对了！</span>`;
        }
        if (!room.nextRoundTimeout && isDrawer) {
          room.nextRoundTimeout = true;
          setTimeout(() => {
            const playerIds = Object.keys(room.players);
            if(playerIds.length === 0) return;
            const nextDrawerId = playerIds[(playerIds.indexOf(String(room.drawerId)) + 1) % playerIds.length];
            const nextDrawer = room.players[nextDrawerId];
            
            fbDb.ref('draw_rooms/' + roomId).update({
              status: 'drawing',
              drawerId: nextDrawerId,
              drawerName: nextDrawer.name,
              word: DRAW_WORDS[Math.floor(Math.random() * DRAW_WORDS.length)],
              imageData: '',
              round: room.round + 1,
              nextRoundTimeout: null
            });
          }, 3000);
        }
      }
    });
  };
}
